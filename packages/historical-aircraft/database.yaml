# Historical Aircraft Reference Database
#
# Curated reference set of 20 well-known fixed-wing aircraft used to anchor
# concept-design comparisons. Numerical fields use SI / standard units:
#   wingspan_m, length_m, mtow_kg, payload_kg, empty_weight_kg,
#   cruise_speed_kmh, range_km, endurance_h, service_ceiling_m, engines.
#
# Sources are public references (manufacturer fact sheets, Jane's, Wikipedia,
# FAA/EASA TCDS). Values are nominal cruise / clean configuration.
#
# Layout vocabulary matches AircraftSpec.aircraft.layout where possible.

